; ShipCheck ignore rules
; Paths support exact paths, folder prefixes ending in '/', or wildcards like res://art/source/*
; Scanner ignores use display names, for example: Debug Code Scanner
; Inline ignores: add '# shipcheck: ignore' to a specific code/resource line.
; ShipCheck also supports ignore-line, ignore-next-line, ignore-file, ignore-start, and ignore-end directives.

[paths]

ignore=[
	"res://.godot/",
	"res://addons/",
	"res://shipcheck_config.cfg",
	"res://shipcheck_ignore.cfg",
	"res://shipcheck_report.md"
]

[scanners]

ignore=[]

[issues]

ignore_ids=[]
